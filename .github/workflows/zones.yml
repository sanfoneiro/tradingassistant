name: Zone sweep

# Runs the universe sweep on a schedule, outside Vercel and outside the
# laptop. This is the job that used to be a scheduled browser agent — the
# one that failed 10 of its 12 runs.
#
# It lives here rather than in vercel.json for two reasons: Hobby crons fire
# at most once a day with hour-level precision, and no serverless function
# survives the ~23 minutes that 114 symbols take at five requests a minute.
# A GitHub Action has hours, costs nothing on a public repo, and the
# schedule is reviewable in a diff.
#
# Required repository secrets — Settings → Secrets and variables → Actions:
#   MASSIVE_API_KEY   market data key (massive.com/dashboard/keys)
#   INGEST_TOKEN      the same bearer token the app expects
#
# Optional repository variable:
#   APP_URL           defaults to the production deployment

on:
  schedule:
    # After the close: 22:10 UTC on weekdays, comfortably past 16:00 ET in
    # both EDT and EST, so the last daily bar is final rather than forming.
    # This is the run that establishes the levels.
    - cron: "10 22 * * 1-5"

    # After the open: ~09:45 ET, once the first fifteen minutes of noise are
    # out of the way. TWO entries because Israel and the US change DST on
    # different dates — 13:45 UTC is 09:45 ET in EDT, 14:45 UTC is 09:45 ET
    # in EST, and for a couple of weeks each spring and autumn the offsets
    # do not line up. Both fire; --after-open checks the NEW YORK clock and
    # the one outside the window exits quietly, so exactly one sweep runs.
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many symbols to sweep (blank = the whole queue)"
        required: false
        type: string

concurrency:
  # A sweep takes ~23 minutes. Two at once would double-post zones and
  # burn the rate limit against itself.
  group: zone-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Must match the npm that wrote package-lock.json. The lock is
      # lockfileVersion 3 written by npm 11, which nests tsx's esbuild 0.28.2
      # and its 26 platform binaries under tsx/node_modules/@esbuild/*. npm 10
      # — what Node 22 ships — resolves that tree differently, looks for those
      # packages where it would have put them, and fails `npm ci` with
      # "Missing: @esbuild/…@0.28.2 from lock file" even though every one of
      # them is present. Node 24 ships npm 11 and the tree agrees.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # The engine is the whole point, so a broken port must stop the run
      # before it writes anything.
      - name: Test the zone engine
        run: npx vitest run src/lib/zones.test.ts

      - name: Sweep
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
        # The 22:10 run recomputes levels from completed candles. The
        # intraday runs pass --after-open, which refreshes distances against
        # a live price while leaving the levels alone — a zone is a fact
        # about closed candles.
        # Only the two intraday crons pass --after-open. The evening run and
        # any manual dispatch leave it off, so a hand-triggered sweep is never
        # silently skipped by the session guard.
        run: >-
          npx tsx src/db/sweep-zones.ts ${{ inputs.limit }}
          ${{ (github.event.schedule == '45 13 * * 1-5' || github.event.schedule == '45 14 * * 1-5') && '--after-open' || '' }}
